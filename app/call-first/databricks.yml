bundle:
  name: call-first

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Genie Space do agente comercial (call_first_v2.gold.*)
  genie_space_name:
    description: Nome do Genie Space

resources:
  apps:
    app:
      name: "call-first"
      description: "Call First: fila do dia priorizada por IA + agente Genie"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # O Genie roda em nome do usuário logado (OBO): precisa dos escopos genie + sql
      user_api_scopes:
        - sql
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com
      profile: pessoal

    variables:
      sql_warehouse_id: a50e6a998ebe9440
      genie_space_id: 01f1e2bdc05010c2a60659fdfad9c0fe
      genie_space_name: "Call First · Agente Comercial"
